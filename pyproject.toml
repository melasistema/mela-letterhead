[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mela-letterhead"
version = "0.2.0"
description = "Turn Markdown into branded PDF documents on your own letterhead, in any language, with Pandoc and Typst."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Luca Visciola (Melasistema)" }]
keywords = [
    "letterhead",
    "markdown",
    "pandoc",
    "typst",
    "pdf",
    "invoice",
    "quotation",
    "i18n",
    "documents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Printing",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/melasistema/mela-letterhead"
Repository = "https://github.com/melasistema/mela-letterhead"
Issues = "https://github.com/melasistema/mela-letterhead/issues"

[project.scripts]
mela-letterhead = "mela_letterhead.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mela_letterhead = [
    "assets/*.typ",
    "assets/*.template",
    "assets/scaffold/*",
    "locales/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
