[build-system]
# 77 is the first release that reads `license` as an SPDX expression rather
# than as free text, which is what PyPI wants and what the classifier used to
# say twice.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mela-letterhead"
version = "0.3.3"
description = "Turn Markdown into branded PDF documents on your own letterhead, in any language, with Pandoc and Typst."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Luca Visciola (Melasistema)" }]
keywords = [
    "letterhead",
    "markdown",
    "pandoc",
    "typst",
    "pdf",
    "invoice",
    "quotation",
    "i18n",
    "documents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Printing",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ruff", "mypy", "types-PyYAML", "build"]

[project.urls]
Homepage = "https://github.com/melasistema/mela-letterhead"
Repository = "https://github.com/melasistema/mela-letterhead"
Documentation = "https://github.com/melasistema/mela-letterhead#readme"
Changelog = "https://github.com/melasistema/mela-letterhead/blob/master/CHANGELOG.md"
Issues = "https://github.com/melasistema/mela-letterhead/issues"

[project.scripts]
mela-letterhead = "mela_letterhead.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mela_letterhead = [
    "assets/*.typ",
    "assets/*.template",
    "assets/scaffold/*",
    "locales/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Measured, not chosen: nothing in `src` reaches 98 columns, so this describes
# the code as it was written rather than asking it to change. Prose in the
# comments and docstrings is wrapped much shorter than this by hand, which is
# also why `ruff format` is not run over this project — it would unwrap those
# lines to fill the column and take the shape out of them. `ruff check`
# enforces the limit; how a line gets under it stays a judgement.
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E and F are the defaults, I keeps the import blocks sorted, B catches the
# mutable-default and loop-variable-capture traps.
#
# UP went in with the 3.10 floor, in a commit that did nothing else: it
# rewrote `Dict[str, Any]` to `dict[str, Any]` and `Optional[str]` to
# `str | None` in 170 places, and a diff that size mixed with a behaviour
# change would hide whatever else was in it.
#
# `from __future__ import annotations` stays in every module. UP does not
# touch it and should not: it is what makes an annotation lazy, and the
# forward references it allows — `Document` in `config.resolve`, imported
# only under TYPE_CHECKING — are now unquoted and rely on it.
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
# The tests monkeypatch freely and are not annotated; `src` is.
files = ["src"]

[tool.coverage.run]
source = ["mela_letterhead"]
# Four lines that exist so `python -m mela_letterhead` works from a clone.
# Running the module to cover them would mean running the whole command.
omit = ["*/__main__.py"]

[tool.coverage.report]
# 91% with Pandoc and Typst installed, which is what CI has. The floor sits
# under that rather than at it, so that moving a line does not fail a build —
# raise it when the number genuinely moves, and never lower it quietly.
fail_under = 88
show_missing = true
