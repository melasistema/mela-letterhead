# English locale pack — the fallback for every other language.
#
# These are the few strings the tool writes itself. Everything else on the page
# (field labels, footer rows, the brand name) is yours, and lives in
# letterhead.yaml.
#
# Italian and German ship beside it. To add another language, copy this file
# to `locales/<tag>.yaml` next to your letterhead.yaml — for example
# `locales/fr.yaml` — and translate the values. A file there named after a
# shipped pack corrects it string by string. Anything you leave out falls back
# to English. No code changes, no rebuild.
#
# Placeholders:
#   {title}  the document's running title
#   {brand}  the brand name
#   {page}   the current page number
#   {pages}  the total number of pages

# Line printed at the top of every page after the first.
running_header: "{title} · page {page} of {pages}"

# The same line for a document with no title of its own: no `title:`, no
# `running-title:` and no heading. A placeholder there would print on a real
# letter, so it shows the page numbers alone.
running_header_untitled: "page {page} of {pages}"

# The PDF's title, in its metadata, when a document declares no title of its
# own.
untitled: "Untitled document"
