name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # `git log v0.1.0..HEAD --oneline` is what a release is written from, so a
  # subject that does not say what kind of change it is costs somebody a dig
  # through the diff later. This runs the same script the commit-msg hook does,
  # for the clones that never enabled it.
  commit-messages:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check every subject on the branch
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message"
            printf '%s  %s\n' "$(git log -1 --format=%h "$sha")" \
                              "$(git log -1 --format=%s "$sha")"
            .githooks/commit-msg "$RUNNER_TEMP/message" || status=1
          done
          exit $status

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The end-to-end tests skip themselves when either of these is missing,
      # so the rest of the suite still runs if an install here ever breaks.
      #
      # Ubuntu's Pandoc is 3.1, several releases behind the 3.11 this was
      # developed against, and its Typst writer spells some helpers
      # differently. That is on purpose: `apt install pandoc` is what the
      # tool's own install hint tells Debian users to run, so this job is
      # where that combination gets tested.
      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install --yes pandoc

      - name: Install Typst
        uses: typst-community/setup-typst@v5

      - name: Install the package
        run: pip install -e ".[dev]"

      - name: Run the tests
        run: pytest -v

      - name: Build the scaffolded letterhead end to end
        run: |
          mkdir -p /tmp/smoke
          cd /tmp/smoke
          mela-letterhead init .
          mela-letterhead check
          mela-letterhead build
          test -f example-letter.pdf
