name: Release

# Releasing is a tag. You bump the version, write the CHANGELOG section in your
# own words, commit, and push the tag; this turns that tag into a GitHub
# release with the section you wrote as its notes, and then into a release on
# PyPI.
#
#     # bump pyproject.toml and src/mela_letterhead/__init__.py,
#     # and head the CHANGELOG section with the new version
#     git commit -am "chore(release): 0.2.0"
#     git tag -a v0.2.0 -m "v0.2.0"
#     git push && git push origin v0.2.0
#
# Nothing here writes to the repository or invents a version number: the
# changelog stays prose, written once, and read back rather than generated.
# What the workflow does instead is refuse a tag that disagrees with the
# package — the one mistake this arrangement invites, since the version now
# lives by hand in three places.
#
# To see the notes a tag would carry before pushing it:
#
#     awk -v want="## [0.2.0]" 'index($0,want)==1{f=1;next} \
#         f&&index($0,"## [")==1{exit} f&&/^\[[^]]+\]: /{exit} f' CHANGELOG.md
on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: Cut the release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # v0.2.0 has to mean 0.2.0 everywhere, or the PDF a user builds reports a
      # version that was never released. Checked before anything is published,
      # because a GitHub release can be deleted but a tag that has been pulled
      # is already in somebody's clone.
      - name: Check the tag against the package
        run: |
          version="${GITHUB_REF_NAME#v}"
          pyproject=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          init=$(grep -m1 '^__version__ = ' src/mela_letterhead/__init__.py | cut -d'"' -f2)

          echo "tag             $version"
          echo "pyproject.toml  $pyproject"
          echo "__init__.py     $init"

          if [ "$version" != "$pyproject" ] || [ "$version" != "$init" ]; then
            echo "::error::the tag and the package disagree about the version" >&2
            exit 1
          fi

      # The same toolchain CI runs on. A tag usually points at a commit master
      # already tested, but "usually" is not a thing to publish on.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install --yes pandoc

      - name: Install Typst
        uses: typst-community/setup-typst@v5

      - name: Install the package
        run: pip install -e ".[dev]"

      - name: Run the tests
        run: pytest -q

      # The section for this version, lifted out of CHANGELOG.md: everything
      # under `## [0.2.0]` up to the next release heading. It stops at the link
      # definitions at the foot of the file too, which would otherwise be
      # swallowed by whichever section happens to be last.
      - name: Read the notes out of the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"

          awk -v want="## [$version]" '
            index($0, want) == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found && /^\[[^]]+\]: / { exit }

            # Blank lines are held rather than printed, and flushed before the
            # next line that has something on it. Blank lines between the
            # sections survive; the run under the heading is never held in the
            # first place, and the run at the end is never flushed.
            found && NF == 0 { if (started) held = held "\n"; next }
            found { printf "%s%s\n", held, $0; held = ""; started = 1 }
          ' CHANGELOG.md > notes.md

          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section to release" >&2
            exit 1
          fi

          echo "--- notes.md ---"
          cat notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag

  # A job of its own, after the release rather than inside it, for two
  # reasons. A failed upload must not take the GitHub release down with it —
  # PyPI refuses a version that is already there, so a retry is a matter of
  # re-running this job alone. And `permissions` is set per job: this is the
  # only one that needs a token to mint an identity with, and it needs nothing
  # else, not even write access to the repository.
  #
  # There is no API token anywhere. Trusted Publishing has PyPI verify the
  # short-lived OIDC token GitHub issues to this workflow, against a publisher
  # registered on the project: repository melasistema/mela-letterhead,
  # workflow release.yml, environment pypi. Change any of those three names
  # and the upload stops being recognised.
  publish:
    name: Publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # Both artefacts. The wheel is what almost everyone installs; the sdist
      # is what a distribution packager builds from, and what carries the
      # tests. Each has to hold the scaffold and the locale packs — a wheel
      # that installs without its plates gives a `mela-letterhead init` that
      # writes a broken letterhead — so that is checked here rather than
      # discovered by the first person to install it.
      - name: Build the artefacts
        run: |
          pip install build
          python -m build

      - name: Check that the scaffold travelled with them
        run: |
          for expected in \
              assets/letterhead.typ \
              assets/pandoc-typst.template \
              assets/scaffold/letterhead.yaml \
              assets/scaffold/example-letter.md \
              assets/scaffold/logo.svg \
              locales/en.yaml; do
            python -m zipfile -l dist/*.whl | grep -q "mela_letterhead/$expected" || {
              echo "::error::the wheel is missing $expected" >&2
              exit 1
            }
            tar tzf dist/*.tar.gz | grep -q "src/mela_letterhead/$expected" || {
              echo "::error::the sdist is missing $expected" >&2
              exit 1
            }
          done
          echo "both artefacts carry the scaffold"

      - uses: pypa/gh-action-pypi-publish@release/v1
